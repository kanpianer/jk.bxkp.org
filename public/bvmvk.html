<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>正在前往 !SolaDrive...</title>
    <meta http-equiv="refresh" content="0; url=https://www.soladrive.com">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://www.soladrive.com">
    <script>
        (function() {
            try {
                window.location.replace("https://www.soladrive.com");
            } catch(e) {
                window.location.href = "https://www.soladrive.com";
            }
        })();
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 460px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 1.15rem;
            color: #f1f5f9;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .desc {
            font-size: 0.875rem;
            color: #64748b;
            line-height: 1.6;
        }
        .link {
            display: inline-block;
            margin-top: 14px;
            color: #38bdf8;
            text-decoration: underline;
            font-size: 0.875rem;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="title">正在前往 !SolaDrive...</div>
        <div class="desc">若浏览器未在数秒内自动跳转，请点击下方链接直接访问：</div>
        <a class="link" href="https://www.soladrive.com">点击直接前往</a>
    </div>
</body>
</html>
