    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        // 自动解析卡片分类与高亮，并确保高亮（带 #）卡片自动排在对应分类（机场 ✈️ 和 VPS ☁️）的最前面
        function initAndSortButtons() {
            const container = document.querySelector('.button-stack');
            if (!container) return;

            const buttons = Array.from(container.querySelectorAll('.button'));

            function getCategory(btn) {
                const text = btn.textContent;
                if (text.includes('✈️') || text.includes('✈')) return 0; // 机场
                if (text.includes('☁️') || text.includes('☁')) return 1; // VPS
                return 2; // 其他
            }

            function isHighlighted(btn) {
                if (btn.querySelector('.highlight-title')) return true;
                const childNodes = Array.from(btn.childNodes);
                for (const node of childNodes) {
                    const text = node.textContent.trim();
                    if (text.startsWith('#') || text.startsWith('＃')) {
                        return true;
                    }
                }
                return false;
            }

            // 按分类分组，高亮卡片排在各自组的最前面，同时保持同组内的原有先后顺序
            const groups = {
                airportHigh: [],
                airportNormal: [],
                vpsHigh: [],
                vpsNormal: [],
                otherHigh: [],
                otherNormal: []
            };

            buttons.forEach(btn => {
                const cat = getCategory(btn);
                const high = isHighlighted(btn);
                if (cat === 0) {
                    if (high) groups.airportHigh.push(btn);
                    else groups.airportNormal.push(btn);
                } else if (cat === 1) {
                    if (high) groups.vpsHigh.push(btn);
                    else groups.vpsNormal.push(btn);
                } else {
                    if (high) groups.otherHigh.push(btn);
                    else groups.otherNormal.push(btn);
                }
            });

            const sortedButtons = [
                ...groups.airportHigh,
                ...groups.airportNormal,
                ...groups.vpsHigh,
                ...groups.vpsNormal,
                ...groups.otherHigh,
                ...groups.otherNormal
            ];

            // 重新在 DOM 容器中挂载排序后的卡片
            sortedButtons.forEach(btn => container.appendChild(btn));

            // 解析卡片名称前的 # 符号并赋予副标题高亮样式
            sortedButtons.forEach(btn => {
                const childNodes = Array.from(btn.childNodes);
                for (const node of childNodes) {
                    if (node.nodeType === Node.TEXT_NODE) {
                        const trimmed = node.textContent.trim();
                        if (trimmed.startsWith('#') || trimmed.startsWith('＃')) {
                            const cleanText = trimmed.replace(/^[#＃]\s*/, '');
                            const span = document.createElement('span');
                            span.className = 'highlight-title';
                            span.textContent = cleanText;
                            node.parentNode.replaceChild(span, node);
                        }
                    } else if (node.nodeType === Node.ELEMENT_NODE && !node.classList.contains('icon')) {
                        const trimmed = node.textContent.trim();
                        if (trimmed.startsWith('#') || trimmed.startsWith('＃')) {
                            node.classList.add('highlight-title');
                            node.textContent = trimmed.replace(/^[#＃]\s*/, '');
                        }
                    }
                }
            });
        }
        initAndSortButtons();

        const airplane = document.querySelector('.airplane');
        let hasCrashed = false;
        let cardsFallen = false;
        let isRewinding = false;
        let lastCrashTime = 0;

        let engine, world, runner;
        let ground, topWall, leftWall, rightWall;
        const domBodies = [];

        let targetGravityX = 0;
        let targetGravityY = 1;
        let permissionRequested = false;

        function updateGravity(gx, gy) {
            targetGravityX = gx;
            targetGravityY = gy;
            if (engine) {
                if (engine.gravity) {
                    engine.gravity.x = gx;
                    engine.gravity.y = gy;
                }
                if (engine.world && engine.world.gravity) {
                    engine.world.gravity.x = gx;
                    engine.world.gravity.y = gy;
                }
            }
        }

        function handleOrientation(event) {
            if (event.beta === null || event.gamma === null) return;

            let beta = event.beta;   // [-180, 180] (Pitch)
            let gamma = event.gamma; // [-90, 90]   (Roll)

            beta = Math.max(-180, Math.min(180, beta));
            gamma = Math.max(-90, Math.min(90, gamma));

            const betaRad = (beta * Math.PI) / 180;
            const gammaRad = (gamma * Math.PI) / 180;

            const gx = Math.sin(gammaRad);
            const gy = Math.sin(betaRad);

            const orientationAngle = (screen.orientation && screen.orientation.angle !== undefined)
                ? screen.orientation.angle
                : (window.orientation || 0);

            const radO = (orientationAngle * Math.PI) / 180;
            const cosO = Math.cos(radO);
            const sinO = Math.sin(radO);

            // Rotate gravity vector according to viewport orientation
            let screenGx = gx * cosO - gy * sinO;
            let screenGy = gx * sinO + gy * cosO;

            screenGx = Math.max(-1.5, Math.min(1.5, screenGx));
            screenGy = Math.max(-1.5, Math.min(1.5, screenGy));

            updateGravity(screenGx, screenGy);
        }

        function requestOrientationPermission() {
            if (permissionRequested) return;
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            permissionRequested = true;
                            window.addEventListener('deviceorientation', handleOrientation, true);
                        }
                    })
                    .catch(console.error);
            } else if (typeof window.DeviceOrientationEvent !== 'undefined') {
                permissionRequested = true;
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        // Auto-listen if permission request API is not needed (e.g. Android Chrome)
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
        window.addEventListener('click', requestOrientationPermission, { once: true });
        window.addEventListener('touchstart', requestOrientationPermission, { once: true });

        function initPhysics() {
            if (engine) {
                Matter.World.clear(engine.world);
                Matter.Engine.clear(engine);
                if (runner) Matter.Runner.stop(runner);
            }

            const Engine = Matter.Engine,
                World = Matter.World,
                Bodies = Matter.Bodies,
                Runner = Matter.Runner;

            engine = Engine.create();
            world = engine.world;

            // Apply current orientation gravity
            updateGravity(targetGravityX, targetGravityY);

            const w = window.innerWidth;
            const h = window.innerHeight;
            const thickness = 100;
            ground = Bodies.rectangle(w / 2, h + thickness / 2, w + 400, thickness, { isStatic: true, friction: 0.8 });
            topWall = Bodies.rectangle(w / 2, -thickness / 2, w + 400, thickness, { isStatic: true, friction: 0.8 });
            leftWall = Bodies.rectangle(-thickness / 2, h / 2, thickness, h * 2 + 400, { isStatic: true, friction: 0.8 });
            rightWall = Bodies.rectangle(w + thickness / 2, h / 2, thickness, h * 2 + 400, { isStatic: true, friction: 0.8 });

            World.add(world, [ground, topWall, leftWall, rightWall]);

            Matter.Events.on(engine, 'afterUpdate', () => {
                if (isRewinding) return;
                for (let db of domBodies) {
                    const { body, el, width, height, history } = db;

                    // For compound bodies, parts[1] is the geometric center of the main rectangle
                    const mainPart = body.parts.length > 1 ? body.parts[1] : body;
                    const x = mainPart.position.x - width / 2;
                    const y = mainPart.position.y - height / 2;

                    el.style.transform = `translate(${x}px, ${y}px) rotate(${body.angle}rad)`;
                    history.push({ x, y, angle: body.angle });
                }
            });

            runner = Runner.create();
            Runner.run(runner, engine);
        }

        window.addEventListener('resize', () => {
            if (!engine || !world || !ground || !topWall || !leftWall || !rightWall) return;
            const w = window.innerWidth;
            const h = window.innerHeight;
            const thickness = 100;
            Matter.Body.setPosition(ground, { x: w / 2, y: h + thickness / 2 });
            Matter.Body.setPosition(topWall, { x: w / 2, y: -thickness / 2 });
            Matter.Body.setPosition(leftWall, { x: -thickness / 2, y: h / 2 });
            Matter.Body.setPosition(rightWall, { x: w + thickness / 2, y: h / 2 });
        });

        function addDomBodyWithRect(el, rect, options = {}) {
            const xCenter = rect.left + rect.width / 2;
            const yCenter = rect.top + rect.height / 2;

            const isFixed = window.getComputedStyle(el).position === 'fixed';
            let placeholder = null;
            if (!isFixed) {
                placeholder = document.createElement('div');
                placeholder.style.width = rect.width + 'px';
                placeholder.style.height = rect.height + 'px';
                el.parentNode.insertBefore(placeholder, el);
            }

            document.body.appendChild(el);

            el.style.position = 'fixed';
            el.style.left = '0';
            el.style.top = '0';
            el.style.margin = '0';
            el.style.width = rect.width + 'px';
            el.style.height = rect.height + 'px';
            el.style.transition = 'none';
            el.style.animation = 'none';
            el.style.transform = `translate(${rect.left}px, ${rect.top}px)`;

            if (el.classList.contains('airplane')) {
                el.style.zIndex = '2';
                el.style.pointerEvents = 'auto';
                el.style.cursor = 'pointer';
            } else {
                el.style.zIndex = '3';
                el.style.pointerEvents = 'auto';
                el.style.cursor = 'pointer';
            }

            const body = Matter.Bodies.rectangle(xCenter, yCenter, rect.width, rect.height, {
                restitution: 0.4,
                friction: 0.8,
                frictionAir: 0.02,
                ...options
            });

            Matter.World.add(world, body);
            domBodies.push({
                body,
                el,
                placeholder,
                width: rect.width,
                height: rect.height,
                history: [{ x: rect.left, y: rect.top, angle: 0 }]
            });
            return body;
        }

        function startRewind() {
            isRewinding = true;
            if (runner) Matter.Runner.stop(runner);

            const rewindFrames = 120; // 2 seconds at 60fps
            let currentFrame = 0;

            function rewindTick() {
                currentFrame++;
                const progress = currentFrame / rewindFrames;
                const easeProgress = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                for (let db of domBodies) {
                    const hLen = db.history.length;
                    if (hLen === 0) continue;

                    if (hLen === 1) {
                        const frame = db.history[0];
                        db.el.style.transform = `translate(${frame.x}px, ${frame.y}px) rotate(${frame.angle}rad)`;
                        continue;
                    }

                    let exactIndex = (1 - easeProgress) * (hLen - 1);
                    exactIndex = Math.max(0, Math.min(hLen - 1, exactIndex));

                    const indexFloor = Math.floor(exactIndex);
                    const indexCeil = Math.ceil(exactIndex);
                    const weight = exactIndex - indexFloor;

                    const frameF = db.history[indexFloor];
                    const frameC = db.history[indexCeil];

                    const x = frameF.x * (1 - weight) + frameC.x * weight;
                    const y = frameF.y * (1 - weight) + frameC.y * weight;

                    let diff = frameC.angle - frameF.angle;
                    while (diff < -Math.PI) diff += 2 * Math.PI;
                    while (diff > Math.PI) diff -= 2 * Math.PI;
                    const angle = frameF.angle + diff * weight;

                    db.el.style.transform = `translate(${x}px, ${y}px) rotate(${angle}rad)`;
                }

                if (currentFrame < rewindFrames) {
                    requestAnimationFrame(rewindTick);
                } else {
                    restoreOriginalState();
                }
            }
            requestAnimationFrame(rewindTick);
        }

        function restoreOriginalState() {
            for (let db of domBodies) {
                const { el, placeholder } = db;

                el.style.position = '';
                el.style.left = '';
                el.style.top = '';
                el.style.margin = '';
                el.style.width = '';
                el.style.height = '';
                el.style.transform = '';
                el.style.transition = '';
                el.style.animation = '';
                el.style.zIndex = '';
                el.style.cursor = '';
                el.style.pointerEvents = '';

                if (placeholder && placeholder.parentNode) {
                    placeholder.parentNode.replaceChild(el, placeholder);
                }
            }

            if (engine) {
                Matter.World.clear(engine.world);
                Matter.Engine.clear(engine);
            }

            const wrapper = document.querySelector('.airplane-wrapper');
            if (wrapper) wrapper.style.animationPlayState = 'running';

            domBodies.length = 0;
            hasCrashed = false;
            cardsFallen = false;
            isRewinding = false;
        }

        function triggerCrash(clientX, clientY) {
            if (hasCrashed) return;
            hasCrashed = true;
            lastCrashTime = Date.now();
            requestOrientationPermission();

            const wrapper = airplane.parentElement;
            if (wrapper && wrapper.classList.contains('airplane-wrapper')) {
                wrapper.style.animationPlayState = 'paused';
            }

            const rect = airplane.getBoundingClientRect();

            initPhysics();
            airplane.style.transition = 'none';
            const planeBody = addDomBodyWithRect(airplane, rect, {
                density: 0.05,
                restitution: 0.15,
                friction: 0.8,
                frictionAir: 0.02
            });

            // Zero initial velocity & angle for immediate in-place vertical dropping
            Matter.Body.setVelocity(planeBody, { x: 0, y: 0 });
            Matter.Body.setAngularVelocity(planeBody, 0.01);
            Matter.Body.setAngle(planeBody, 0);
        }

        airplane.addEventListener('mouseenter', (event) => {
            triggerCrash(event.clientX, event.clientY);
        });

        airplane.addEventListener('touchstart', (event) => {
            requestOrientationPermission();
            if (!hasCrashed) {
                const touch = event.touches[0];
                triggerCrash(touch ? touch.clientX : undefined, touch ? touch.clientY : undefined);
            }
        }, { passive: true });

        function handleAirplaneClick(e) {
            if (!hasCrashed) {
                triggerCrash(e ? e.clientX : undefined, e ? e.clientY : undefined);
                return;
            }
            if (Date.now() - lastCrashTime < 350) return; // Prevent touch synthesized click
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            if (!cardsFallen) {
                cardsFallen = true;
                const cardsArray = Array.from(document.querySelectorAll('.button'));

                // Shuffle array for random drop order
                for (let i = cardsArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cardsArray[i], cardsArray[j]] = [cardsArray[j], cardsArray[i]];
                }

                cardsArray.forEach((card, i) => {
                    setTimeout(() => {
                        const rect = card.getBoundingClientRect();
                        const body = addDomBodyWithRect(card, rect, { density: 0.005, restitution: 0.2 });

                        // Random point on the card (relative to its center)
                        const offsetX = (Math.random() - 0.5) * rect.width;
                        const offsetY = (Math.random() - 0.5) * rect.height;
                        const forcePosition = {
                            x: body.position.x + offsetX,
                            y: body.position.y + offsetY
                        };

                        // Downward angled force
                        const forceMagnitude = body.mass * (0.001 + Math.random() * 0.002);
                        const forceAngle = Math.PI / 4 + Math.random() * (Math.PI / 2);

                        const forceVector = {
                            x: forceMagnitude * Math.cos(forceAngle),
                            y: forceMagnitude * Math.sin(forceAngle)
                        };

                        Matter.Body.applyForce(body, forcePosition, forceVector);
                    }, i * 120);
                });
            } else if (!isRewinding) {
                startRewind();
            }
        }

        function handleCardClick(e) {
            // 允许卡片点击后跳转链接，不再阻止默认行为和触发回退
            if (cardsFallen && isRewinding) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }
        }

        airplane.addEventListener('click', handleAirplaneClick);
        airplane.addEventListener('touchend', (e) => {
            if (hasCrashed) {
                handleAirplaneClick(e);
            }
        });

        document.querySelectorAll('.button').forEach(btn => {
            btn.addEventListener('click', handleCardClick);
            btn.addEventListener('touchend', (e) => {
                if (cardsFallen) {
                    handleCardClick(e);
                }
            });
        });
    </script>
