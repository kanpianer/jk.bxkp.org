<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Exact linear gradient: Top-Right (#0077f6) to Bottom-Left (#5afef2) -->
    <linearGradient id="lamhostingGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077f6"/>
      <stop offset="50%" stop-color="#00b4f8"/>
      <stop offset="100%" stop-color="#5afef2"/>
    </linearGradient>
    
    <!-- Luminous Ring Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Subtle Rounded Square matching user image -->
  <rect width="128" height="128" rx="12" fill="url(#lamhostingGrad)"/>
  
  <!-- Lamhosting Official White Luminous Ring -->
  <path d="M 96.94 42.20 
           A 39.5 39.5 0 1 1 85.80 31.06 
           L 78.63 41.90 
           A 26.5 26.5 0 1 0 86.10 49.37 
           Z" 
        fill="#ffffff" 
        filter="url(#glow)"/>
</svg>