<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="jms-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7c2d12" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#jms-bg)"/>
  
  <g filter="url(#shadow)">
    <!-- Sock Cuff -->
    <rect x="20" y="12" width="18" height="6" rx="2" fill="#ffffff"/>
    <rect x="22" y="14" width="14" height="1.5" rx="0.5" fill="#f59e0b"/>

    <!-- Sock Main Body -->
    <path d="M21 17
             h16
             v14
             c0 2 0.8 3.5 2.2 4.8
             l7.5 6.8
             c3.2 2.9 3.2 7.8 0 10.7
             s-7.8 2.9-10.7 0
             l-12.8 -11.5
             c-2.4 -2.2 -3.7 -5.2 -3.7 -8.4
             v-16.4
             z"
          fill="#ffffff"/>

    <!-- Heel patch -->
    <path d="M19.5 35.4
             c-0.2 2.8 1 5.5 3.2 7.5
             l4 3.6
             c-2.8 0.5 -5.8 -0.6 -7.8 -2.8
             c-2.5 -2.7 -2.8 -6.8 -0.8 -9.8
             l1.4 1.5
             z"
          fill="#f97316"
          opacity="0.85"/>

    <!-- Toe patch -->
    <path d="M43 47.8
             l3.7 3.3
             c2.2 2 2.2 5.2 0 7.2
             s-5.2 2 -7.2 0
             l-3.7 -3.3
             c2.8 0 5.4 -2.6 7.2 -7.2
             z"
          fill="#f97316"
          opacity="0.85"/>
  </g>
</svg>
